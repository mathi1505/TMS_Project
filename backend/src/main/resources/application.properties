 spring.application.name=training-management-system

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tms_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Mathii_05}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
# Belt-and-braces: stop Hibernate/the JDBC driver from re-converting
# LocalDateTime values through the JVM's default timezone when binding them -
# activity_log timestamps are already computed in Asia/Kolkata in code.
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

app.cors.allowed-origins=http://localhost:4200

app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-string-before-deploying-tms-2026}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

spring.jackson.default-property-inclusion=non_null

app.encryption.key=${ENCRYPTION_KEY:k3tnObZcsE1GoVvrh0o186sYPnQnksFiSKnPFBxsH18=}
