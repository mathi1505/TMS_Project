<div class="login-shell">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="login-brand">
      <img src="/images/lissomsoft-logo-full.png" alt="Lissomsoft Technologies LLP" class="login-logo" />
      <h1>Training &amp; Internship<br>Management System</h1>
      <p class="login-subtitle">Sign in to continue</p>
    </div>

    @if (errorMessage) {
      <div class="login-error">{{ errorMessage }}</div>
    }

    <label class="login-field">
      <span>Username</span>
      <input
        type="text"
        formControlName="username"
        autocomplete="username"
        placeholder="Enter your username"
        autofocus>
    </label>

    <label class="login-field">
      <span>Password</span>
      <div class="login-password-wrap">
        <input
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••">
        <button
          type="button"
          class="login-password-toggle"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          tabindex="-1">
          @if (showPassword) {
            <!-- eye-off -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-3.22 4.44"/>
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          } @else {
            <!-- eye -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          }
        </button>
      </div>
    </label>

    <button type="submit" class="login-submit" [disabled]="submitting">
      {{ submitting ? 'Signing in…' : 'Sign In' }}
    </button>
  </form>

  @if (showChangePasswordPrompt) {
    <div class="prompt-overlay">
      <div class="prompt-card">
        <h2>Change your password?</h2>
        <p>This looks like your first time signing in. Would you like to set a new password now?</p>
        <div class="prompt-actions">
          <button type="button" class="prompt-btn prompt-btn-secondary" (click)="respondToChangePasswordPrompt(false)">No, later</button>
          <button type="button" class="prompt-btn prompt-btn-primary" (click)="respondToChangePasswordPrompt(true)">Yes, change it</button>
        </div>
      </div>
    </div>
  }
</div>
