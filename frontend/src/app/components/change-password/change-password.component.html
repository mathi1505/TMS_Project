<div class="login-shell">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="login-brand">
      <img src="/images/lissomsoft-logo-full.png" alt="Lissomsoft Technologies LLP" class="login-logo" />
      <h1>Set Your Password</h1>
      <p class="login-subtitle">For your security, please set a new password before continuing.</p>
    </div>

    @if (errorMessage) {
      <div class="login-error">{{ errorMessage }}</div>
    }

    <label class="login-field">
      <span>Current Password</span>
      <div class="login-password-wrap">
        <input
          [type]="showCurrentPassword ? 'text' : 'password'"
          formControlName="currentPassword"
          autocomplete="current-password"
          placeholder="••••••••"
          autofocus>
        <button
          type="button"
          class="login-password-toggle"
          (click)="toggleCurrentPasswordVisibility()"
          [attr.aria-label]="showCurrentPassword ? 'Hide password' : 'Show password'"
          tabindex="-1">
          @if (showCurrentPassword) {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-3.22 4.44"/>
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          } @else {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          }
        </button>
      </div>
    </label>

    <label class="login-field">
      <span>New Password</span>
      <div class="login-password-wrap">
        <input
          [type]="showNewPassword ? 'text' : 'password'"
          formControlName="newPassword"
          autocomplete="new-password"
          placeholder="At least 6 characters">
        <button
          type="button"
          class="login-password-toggle"
          (click)="toggleNewPasswordVisibility()"
          [attr.aria-label]="showNewPassword ? 'Hide password' : 'Show password'"
          tabindex="-1">
          @if (showNewPassword) {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-3.22 4.44"/>
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          } @else {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          }
        </button>
      </div>
    </label>

    <label class="login-field">
      <span>Confirm New Password</span>
      <input
        type="password"
        formControlName="confirmPassword"
        autocomplete="new-password"
        placeholder="Re-enter new password">
    </label>

    <button type="submit" class="login-submit" [disabled]="submitting">
      {{ submitting ? 'Saving…' : 'Save & Continue' }}
    </button>
  </form>
</div>
